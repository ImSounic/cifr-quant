# EUR/USD 1-hour finetuning config for Kronos

data:
  data_path: "../data/processed/eur/tokenizer_train.csv"
  lookback_window: 512
  predict_window: 24        # 24 candles = 1 day at 1-hour
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 30       # More epochs: smaller dataset
  basemodel_epochs: 15
  batch_size: 16             # Smaller batch for smaller dataset
  log_interval: 50
  num_workers: 4
  seed: 42

  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.000003   # Conservative for small dataset

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 2      # Effective batch = 32

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "cifr-eur"
  base_path: "../checkpoints"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "predictor"

experiment:
  name: "cifr_eur_finetune"
  description: "EUR/USD 1-hour finetuning for cifr-quant"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
