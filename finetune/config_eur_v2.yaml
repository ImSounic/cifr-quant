# EUR/USD v2 — seed 137 for multi-seed ensemble
# Same hyperparams as v1 (which worked well), different seed

data:
  data_path: "/home/s3702111/cifr-quant/data/processed/eur/tokenizer_train.csv"
  lookback_window: 512
  predict_window: 24
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 30
  basemodel_epochs: 15
  batch_size: 64
  log_interval: 50
  num_workers: 8
  seed: 137                   # Different seed for ensemble diversity

  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.000003

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "cifr-eur-v2"
  base_path: "../checkpoints"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "predictor"

experiment:
  name: "cifr_eur_v2"
  description: "EUR/USD v2 — seed 137 for ensemble"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
